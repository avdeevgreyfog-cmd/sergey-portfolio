name: Portfolio V5 QA and Pages
on:
  push:
    branches: [main, portfolio-v5-work]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build production site
        env:
          BASE_PATH: /sergey-portfolio
          SITE_URL: https://avdeevgreyfog-cmd.github.io/sergey-portfolio
        run: npm run build
      - name: Static and scalability QA
        run: npm test
      - name: Install browser QA tools
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Functional browser QA
        run: npm run test:browser
      - name: Visual screenshot QA
        run: npm run test:visual
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v5-visual-qa
          path: |
            qa-screens
            visual-report
          if-no-files-found: warn
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Production route smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://avdeevgreyfog-cmd.github.io/sergey-portfolio'
          check_route(){ local path="$1" expected="$2" body=''; for attempt in $(seq 1 18); do body="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${base}${path}?release=${GITHUB_SHA}" || true)"; if grep -Fq "$expected" <<<"$body"; then echo "PASS ${path}"; return 0; fi; sleep 5; done; echo "FAIL ${path}"; return 1; }
          check_route '/' 'Создаю цифровые продукты'
          check_route '/works/' 'data-work-filters'
          check_route '/work/raznye-ludi/' 'Разные люди'
          check_route '/demo/raznye-ludi/' 'Присоединяйся к команде'
          check_route '/services/' 'Разработка сайтов'
          check_route '/process/' 'Как работаю'
          check_route '/contact/' 'Обсудить'
          echo 'PRODUCTION SMOKE PASS'
