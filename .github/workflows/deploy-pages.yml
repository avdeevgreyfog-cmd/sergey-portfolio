name: Portfolio V3 QA and Pages

on:
  push:
    branches: [main, portfolio-v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build production site
        env:
          BASE_PATH: /sergey-portfolio
          SITE_URL: https://avdeevgreyfog-cmd.github.io/sergey-portfolio
        run: npm run build
      - name: Static and scalability QA
        run: npm test
      - name: Install browser QA tools
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Functional browser QA
        run: npm run test:browser
      - name: Visual screenshot QA
        run: npm run test:visual
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v3-visual-qa
          path: |
            qa-screens
            visual-report
          if-no-files-found: warn
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Production route smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://avdeevgreyfog-cmd.github.io/sergey-portfolio'
          check_route() {
            local path="$1"
            local expected="$2"
            local url="${base}${path}?release=${GITHUB_SHA}"
            local body=''
            for attempt in $(seq 1 18); do
              body="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url" || true)"
              if grep -Fq "$expected" <<<"$body"; then
                echo "PASS ${path} -> ${expected}"
                return 0
              fi
              echo "Waiting for Pages propagation: ${path} (attempt ${attempt}/18)"
              sleep 5
            done
            echo "FAIL ${path}: expected '${expected}'"
            return 1
          }
          check_route '/' 'Сайты и'
          check_route '/works/' 'Работы'
          check_route '/work/raznye-ludi/' 'Разные люди'
          check_route '/demo/raznye-ludi/' 'Присоединяйся к команде'
          check_route '/effects/' 'Интерактив'
          check_route '/effects/video-scroll/' 'Видео при прокрутке'
          check_route '/effects/scroll-story/' 'Scroll-повествование'
          check_route '/effects/kinetic-type/' 'Кинетическая типографика'
          check_route '/process/' 'Как работаю'
          check_route '/contact/' 'Обсудить проект'
          echo 'PRODUCTION SMOKE PASS'
