name: Portfolio V6 QA and Pages
on:
  push:
    branches: [main, portfolio-v6]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build production site
        env:
          BASE_PATH: /sergey-portfolio
          SITE_URL: https://avdeevgreyfog-cmd.github.io/sergey-portfolio
        run: npm run build
      - name: Static and scalability QA
        run: npm test
      - name: Install browser QA tools
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Functional browser QA
        run: npm run test:browser
      - name: Visual screenshot QA
        run: npm run test:visual
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v6-visual-qa
          path: |
            qa-screens
            visual-report
          if-no-files-found: warn
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Production route smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://avdeevgreyfog-cmd.github.io/sergey-portfolio'
          check_route(){ local path="$1" expected="$2" body='' code=''; for attempt in $(seq 1 18); do code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "${base}${path}?release=${GITHUB_SHA}" || true)"; body="$(cat /tmp/page.html 2>/dev/null || true)"; if [ "$code" = '200' ] && grep -Fq "$expected" <<<"$body"; then echo "PASS ${path} HTTP ${code}"; return 0; fi; echo "RETRY ${path} HTTP ${code}"; sleep 5; done; echo "FAIL ${path} HTTP ${code}"; return 1; }
          check_route '/demo/operations-os/' 'Operations OS'
          check_route '/' 'Сайты и веб-приложения'
          check_route '/works/' 'data-work-filters'
          check_route '/work/raznye-ludi/' 'Рабочий интерфейс'
          check_route '/services/' 'Что могу разработать'
          check_route '/process/' 'Как проходит работа'
          check_route '/contact/' 'Обсудить'
          echo 'PRODUCTION SMOKE PASS'
